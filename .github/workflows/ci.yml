name: Teedy CI流水线
on:
  push:
    branches: [ master ]
jobs:
  build-test:
    runs-on: ubuntu-latest
   steps:
 steps:
  - name: 检出代码
    uses: actions/checkout@v4

  - name: 配置Java17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin
      cache: maven

  - name: Maven编译打包
    run: mvn clean compile --batch-mode

  - name: PMD代码质量扫描
    run: mvn pmd:pmd --batch-mode || true

  - name: 运行单元测试
    run: mvn test --batch-mode

  - name: 生成JavaDoc接口文档
    run: mvn javadoc:javadoc --batch-mode

  - name: 保存构建Jar包
    uses: actions/upload-artifact@v4
    with:
      name: teedy产物包
      path: |
        target/*.jar
        target/surefire-reports
        target/pmd
        target/site/apidocs