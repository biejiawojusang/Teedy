name: Teedy CI流水线
on:
  push:
    branches: [ master ]
jobs:
  build-test:
    runs-on: ubuntu-latest
   steps:
  - name: 拉取Teedy源码
    uses: actions/checkout@v4

  - name: 配置JDK17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: maven

  # 1. 先Maven编译（调整到PMD前面）
  - name: Maven构建
    run: mvn clean compile --batch-mode

  # 2. PMD代码检查，增加 -DfailOnViolation=false 忽略违规报错
  - name: PMD代码检查
    run: mvn pmd:pmd -DfailOnViolation=false --batch-mode

  - name: 运行单元测试
    run: mvn test --batch-mode

  - name: 生成JavaDoc项目文档
    run: mvn javadoc:javadoc --batch-mode

  - name: 上传构建产物
    uses: actions/upload-artifact@v4
    with:
      name: teedy-results
      path: |
        target/*.jar
        target/surefire-reports/
        target/pmd/
        target/site/apidocs/